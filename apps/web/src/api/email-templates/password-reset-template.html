<!doctype html>
<html>
	<body style="font-family: Arial, sans-serif; background: #f6f9fc; padding: 20px; margin: 0">
		<table
			width="100%"
			cellpadding="0"
			cellspacing="0"
			style="max-width: 600px; margin: auto; background: #ffffff; padding: 40px; border-radius: 8px"
		>
			<tr>
				<td>
					<h2 style="margin-top: 0; color: #333">Reset your password</h2>
					<p style="color: #555">
						We received a request to reset your password. Click the button below to set a new password.
					</p>
					<p style="text-align: center; margin: 30px 0">
						<a
							href="{{resetLink}}"
							style="
								background: #007bff;
								color: white;
								padding: 12px 24px;
								border-radius: 4px;
								text-decoration: none;
							"
							>Reset Password</a
						>
					</p>
					<p style="color: #888; font-size: 14px">
						If you didn’t request this, you can safely ignore this email.
					</p>
					<hr style="border: none; border-top: 1px solid #eee; margin: 40px 0" />
					<p style="color: #999; font-size: 12px">This link will expire in {{linkExpiration}} minutes.</p>
				</td>
			</tr>
		</table>
	</body>
</html>
