<!doctype html>
<html>
	<body style="font-family: Arial, sans-serif; background: #f6f9fc; padding: 20px; margin: 0">
		<table
			width="100%"
			cellpadding="0"
			cellspacing="0"
			style="max-width: 600px; margin: auto; background: #ffffff; padding: 40px; border-radius: 8px"
		>
			<tr>
				<td>
					<h2 style="margin-top: 0; color: #333">Welcome to {{AppName}}</h2>
					<p style="color: #555">
						Your account has been created. Use the information below to log in and set up your
						password.
					</p>
					<p style="color: #333"><strong>Email:</strong> {{userEmail}}</p>
					<p style="color: #333"><strong>Temporary Password:</strong> {{defaultPassword}}</p>
					<p style="margin: 30px 0; text-align: center">
						<a
							href="{{loginLink}}"
							style="
								background: #007bff;
								color: white;
								padding: 12px 24px;
								border-radius: 4px;
								text-decoration: none;
							"
							>Log In</a
						>
					</p>
					<p style="color: #555">You will be prompted to set a new password upon first login.</p>
					<hr style="border: none; border-top: 1px solid #eee; margin: 40px 0" />
					<p style="color: #999; font-size: 12px">
						If you have questions, contact our support team.
					</p>
				</td>
			</tr>
		</table>
	</body>
</html>
