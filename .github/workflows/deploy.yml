name: Build and Deploy (staging auto, prod manual)

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy-staging:
        name: Deploy Staging
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        environment: staging
        permissions:
            id-token: write
            contents: read
        concurrency:
            group: deploy-${{ github.ref }}
            cancel-in-progress: true

        env:
            RG: Manifest
            ACR_NAME: ca735b7ce9aeacr
            IMAGE_REPO: manifest-container-app
            IMAGE_TAG: ${{ github.sha }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Azure Login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.MANIFESTCONTAINERAPP_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.MANIFESTCONTAINERAPP_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.MANIFESTCONTAINERAPP_AZURE_SUBSCRIPTION_ID }}

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm --workspace apps/web test -- --run

            - name: Build image in ACR
              run: |
                  az acr build \
                    --registry $ACR_NAME \
                    --image $IMAGE_REPO:$IMAGE_TAG \
                    --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
                    .

            - name: Deploy Container App (staging)
              run: |
                  az containerapp update \
                    --name app-staging \
                    --resource-group $RG \
                    --image ${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${IMAGE_TAG} \
                    --set-env-vars \
                      PORT=8080 \
                      NODE_ENV=production \
                      AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
                      NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
                      BASE_URL="${{ secrets.BASE_URL }}" \
                      DB_HOST="${{ secrets.DB_HOST }}" \
                      DB_PORT="${{ secrets.DB_PORT }}" \
                      DB_USER="${{ secrets.DB_USER }}" \
                      DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                      DB_DATABASE="${{ secrets.DB_DATABASE }}" \
                      DB_SCHEMA="${{ secrets.DB_SCHEMA }}" \
                      RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
                      EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
                      MUI_KEY="${{ secrets.MUI_KEY }}" \
                      AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
                      CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}" \
                      CLERK_WEBHOOK_SECRET="${{ secrets.CLERK_WEBHOOK_SECRET }}" \
                      NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"

            - name: Show active revision image (sanity)
              run: |
                  az containerapp revision list \
                    --name app-staging \
                    --resource-group $RG \
                    --query "[?properties.active==\`true\`].[name,properties.template.containers[0].image]" \
                    -o table

    deploy-prod:
        name: Deploy Production
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        environment: prod
        permissions:
            id-token: write
            contents: read

        env:
            RG: Manifest
            ACR_NAME: ca735b7ce9aeacr
            IMAGE_REPO: manifest-container-app
            IMAGE_TAG: ${{ github.sha }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Azure Login (OIDC)
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.MANIFESTCONTAINERAPP_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.MANIFESTCONTAINERAPP_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.MANIFESTCONTAINERAPP_AZURE_SUBSCRIPTION_ID }}

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm --workspace apps/web test -- --run

            - name: Build image in ACR
              run: |
                  az acr build \
                    --registry $ACR_NAME \
                    --image $IMAGE_REPO:$IMAGE_TAG \
                    --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
                    .

            - name: Update migration job image to this build
              run: |
                  az containerapp job update \
                  --name aca-prod-migration-job \
                  --resource-group Manifest \
                  --image ca735b7ce9aeacr.azurecr.io/manifest-container-app:${{ github.sha }}

            - name: Set database secrets for migration job
              run: |
                  az containerapp job secret set \
                  --name aca-prod-migration-job \
                  --resource-group Manifest \
                  --secrets \
                    db-host="${{ secrets.DB_HOST }}" \
                    db-port="${{ secrets.DB_PORT }}" \
                    db-user="${{ secrets.DB_USER }}" \
                    db-password="${{ secrets.DB_PASSWORD }}" \
                    db-database="${{ secrets.DB_DATABASE }}" \
                    db-schema="${{ secrets.DB_SCHEMA }}"

            - name: Start migration job
              run: |
                  az containerapp job start \
                  --name aca-prod-migration-job \
                  --resource-group Manifest

            - name: Wait for migration job execution to complete
              shell: bash
              run: |
                  set -euo pipefail

                  JOB="aca-prod-migration-job"
                  RG="Manifest"

                  echo "Locating latest execution for job: $JOB"

                  # Get the latest execution name by startTime
                  EXEC_NAME=$(az containerapp job execution list \
                  --name "$JOB" \
                  --resource-group "$RG" \
                  --query "sort_by([].{name:name,start:properties.startTime}, &start)[-1].name" \
                  -o tsv)

                  if [[ -z "$EXEC_NAME" ]]; then
                  echo "ERROR: Could not find a job execution."
                  exit 1
                  fi

                  echo "Latest execution: $EXEC_NAME"
                  echo "Polling execution status..."

                  # Poll until terminal state
                  for i in {1..120}; do
                  STATUS=$(az containerapp job execution show \
                      --name "$JOB" \
                      --resource-group "$RG" \
                      --job-execution-name "$EXEC_NAME" \
                      --query "properties.status" \
                      -o tsv)

                  echo "Status: $STATUS"

                  case "$STATUS" in
                      Succeeded|Completed)
                      echo "Migration job completed successfully."
                      exit 0
                      ;;
                      Failed)
                      echo "ERROR: Migration job failed."
                      echo "Fetching execution details..."
                      az containerapp job execution show \
                          --name "$JOB" \
                          --resource-group "$RG" \
                          --job-execution-name "$EXEC_NAME" \
                          -o json
                      exit 1
                      ;;
                  esac

                  sleep 10
                  done

                  echo "ERROR: Timed out waiting for migration job."
                  exit 1

            - name: Deploy Container App (prod)
              run: |
                  az containerapp update \
                    --name app-prod \
                    --resource-group $RG \
                    --image ${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${IMAGE_TAG} \
                    --set-env-vars \
                      PORT=8080 \
                      NODE_ENV=production \
                      AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
                      NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
                      BASE_URL="${{ secrets.BASE_URL }}" \
                      DB_HOST="${{ secrets.DB_HOST }}" \
                      DB_PORT="${{ secrets.DB_PORT }}" \
                      DB_USER="${{ secrets.DB_USER }}" \
                      DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                      DB_DATABASE="${{ secrets.DB_DATABASE }}" \
                      DB_SCHEMA="${{ secrets.DB_SCHEMA }}" \
                      RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
                      EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
                      MUI_KEY="${{ secrets.MUI_KEY }}" \
                      AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
                      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
                      CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}" \
                      CLERK_WEBHOOK_SECRET="${{ secrets.CLERK_WEBHOOK_SECRET }}" \
                      NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"

            - name: Show active revision image (sanity)
              run: |
                  az containerapp revision list \
                    --name app-prod \
                    --resource-group $RG \
                    --query "[?properties.active==\`true\`].[name,properties.template.containers[0].image]" \
                    -o table
