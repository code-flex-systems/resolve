name: Trigger auto deployment for manifest-container-app

# When this action will be executed
on:
    # Automatically trigger it when detected changes in repo
    push:
        branches: [main]
        paths:
            - '**'
            - '.github/workflows/manifest-container-app-AutoDeployTrigger-7eaf768c-b5e1-4761-818b-b8a9f7423ef5.yml'

    # Allow manual trigger
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            id-token: write #This is required for requesting the OIDC JWT Token
            contents: read #Required when GH token is used to authenticate with private repo

        steps:
            - name: Checkout to the branch
              uses: actions/checkout@v2

            - name: Azure Login
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.MANIFESTCONTAINERAPP_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.MANIFESTCONTAINERAPP_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.MANIFESTCONTAINERAPP_AZURE_SUBSCRIPTION_ID }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run database migrations
              env:
                  NODE_ENV: production
                  DB_HOST: ${{ secrets.DB_HOST }}
                  DB_PORT: ${{ secrets.DB_PORT }}
                  DB_USER: ${{ secrets.DB_USER }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  DB_DATABASE: ${{ secrets.DB_DATABASE }}
                  DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
              run: |
                  echo "Running database migrations..."
                  npm --workspace apps/web run db:migrate
                  echo "Migrations complete!"

            - name: Build and deploy Container App
              run: |
                  # Check current status
                  echo "Current container app status:"
                  az containerapp show \
                    --name manifest-container-app \
                    --resource-group Manifest \
                    --query "properties.provisioningState" -o tsv

                  # Build and deploy
                  az containerapp up \
                    --name manifest-container-app \
                    --resource-group Manifest \
                    --source . \
                    --ingress external \
                    --target-port 8080 \
                    --env-vars \
                      PORT=8080 \
                      NODE_ENV=production \
                      AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
                      NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
                      BASE_URL="${{ secrets.BASE_URL }}" \
                      DB_HOST="${{ secrets.DB_HOST }}" \
                      DB_PORT="${{ secrets.DB_PORT }}" \
                      DB_USER="${{ secrets.DB_USER }}" \
                      DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                      DB_DATABASE="${{ secrets.DB_DATABASE }}" \
                      DB_SCHEMA="${{ secrets.DB_SCHEMA }}" \
                      RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
                      EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
                      MUI_KEY="${{ secrets.MUI_KEY }}" \
                      AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"

                  # List all revisions
                  echo "All revisions:"
                  az containerapp revision list \
                    --name manifest-container-app \
                    --resource-group Manifest \
                    --query "[].{name:name,active:properties.active,trafficWeight:properties.trafficWeight}" -o table

                  # Get the latest revision name and check if it's active
                  LATEST_REVISION=$(az containerapp revision list \
                    --name manifest-container-app \
                    --resource-group Manifest \
                    --query "max_by([], &properties.createdTime).name" -o tsv)

                  echo "Latest revision: $LATEST_REVISION"

                  # Check if the latest revision is already active
                  IS_ACTIVE=$(az containerapp revision show \
                    --revision $LATEST_REVISION \
                    --resource-group Manifest \
                    --query "properties.active" -o tsv)

                  echo "Is active: $IS_ACTIVE"

                  # Activate it only if not already active
                  if [ ! -z "$LATEST_REVISION" ] && [ "$IS_ACTIVE" != "true" ]; then
                    echo "Activating revision: $LATEST_REVISION"
                    az containerapp revision activate \
                      --revision $LATEST_REVISION \
                      --resource-group Manifest
                  else
                    echo "Revision is already active, no action needed"
                  fi

                  echo "Deployment complete!"

                  # Show recent container logs
                  echo "=== Recent Container Logs ==="
                  az containerapp logs show \
                    --name manifest-container-app \
                    --resource-group Manifest \
                    --tail 50 \
                    --follow false || echo "Could not fetch logs (container may still be starting)"
